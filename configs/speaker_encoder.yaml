# Qwen3-TTS Speaker Encoder Configuration
# ECAPA-TDNN for speaker embedding extraction

# Audio Processing
audio:
  sample_rate: 24000
  num_mels: 128
  n_fft: 1024
  hop_size: 256
  win_size: 1024

# Model Architecture
model:
  enc_dim: 1024              # Final embedding dimension
  enc_channels: [512, 512, 512, 512, 1536]
  enc_kernel_sizes: [5, 3, 3, 3, 1]
  enc_dilations: [1, 2, 3, 4, 1]
  enc_attention_channels: 128
  enc_res2net_scale: 8
  enc_se_channels: 128

# Training Parameters
training:
  batch_size: 128            # Total (num_speakers * samples_per_speaker)
  learning_rate: 1e-3
  num_epochs: 50
  warmup_steps: 5000
  max_grad_norm: 1.0
  weight_decay: 1e-4

# Metric Learning
metric_learning:
  metric: arcface             # or cosface
  arcface_margin: 0.3
  arcface_scale: 30.0
  cosface_margin: 0.3
  cosface_scale: 30.0

# Batch Sampling (important for metric learning)
batch_sampling:
  num_speakers: 32            # Speakers per batch
  samples_per_speaker: 4      # Utterances per speaker per batch

# Loss Weights
losses:
  ce_weight: 1.0              # Cross-entropy loss
  metric_weight: 1.0          # ArcFace/CosFace loss

# Data Augmentation
augmentation:
  spec_augment: true
  spec_augment_time_steps: 100
  spec_augment_freq_steps: 20
  mixup: false
  mixup_alpha: 1.0
  time_stretch: false
  time_stretch_rate: [0.9, 1.1]

# Data
data:
  min_audio_length: 1.0       # seconds
  max_audio_length: 10.0
  num_workers: 4
  pin_memory: true

# Optimization
optimization:
  optimizer: adamw
  betas: [0.9, 0.999]
  eps: 1e-8

# Checkpointing
checkpoint:
  save_steps: 500
  eval_steps: 100
  save_total_limit: 3
  resume_from: null

# Logging
logging:
  log_level: info
  log_frequency: 10
  use_tensorboard: true
  use_wandb: false
  wandb_project: qwen3-tts-speaker-encoder

# Hardware
hardware:
  mixed_precision: bf16
  gradient_checkpointing: false
  num_gpus: 4

# Validation
validation:
  compute_speaker_verification: true
  compute_accuracy: true
  num_val_batches: -1        # -1 for full validation set

# Seed
seed: 42
