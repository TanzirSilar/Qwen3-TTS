# Qwen3-TTS Tokenizer Configuration
# VQ-VAE codec for speech compression

# Audio Processing
audio:
  sample_rate: 24000
  num_mels: 128
  n_fft: 1024
  hop_size: 256
  win_size: 1024
  fmin: 0
  fmax: 12000

# Model Architecture
model:
  num_codebooks: 16
  codebook_size: 2048
  hidden_dim: 512
  embedding_dim: 64
  encoder_channels: [256, 512, 512]
  decoder_channels: [512, 512, 256]

# Training Parameters
training:
  batch_size: 32
  learning_rate: 1e-4
  num_epochs: 100
  warmup_steps: 10000
  max_grad_norm: 1.0
  weight_decay: 0.01

  # Scheduler
  scheduler_type: cosine
  num_warmup_steps: 10000

# Loss Weights
losses:
  reconstruction_weight: 1.0
  commitment_weight: 0.25
  adversarial_weight: 0.1  # Set to 0 to disable

# Data
data:
  min_audio_length: 1.0    # seconds
  max_audio_length: 20.0
  num_workers: 4
  pin_memory: true

# Optimization
optimization:
  optimizer: adamw
  betas: [0.9, 0.95]
  eps: 1e-8

# Checkpointing
checkpoint:
  save_steps: 500
  eval_steps: 500
  save_total_limit: 5
  resume_from: null

# Logging
logging:
  log_level: info
  log_frequency: 10
  use_tensorboard: true
  use_wandb: false
  wandb_project: qwen3-tts-tokenizer

# Hardware
hardware:
  mixed_precision: bf16
  gradient_checkpointing: false
  num_gpus: 1  # Will be auto-detected

# Validation
validation:
  compute_reconstruction_metrics: true
  compute_codebook_usage: true
  num_val_batches: -1  # -1 for full validation set

# Seed
seed: 42
